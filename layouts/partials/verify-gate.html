<!-- layouts/partials/verify-gate.html -->
<style>
  /* 强制模态框样式，防止被覆盖 */
  #accessModal {
    display: none; /* 默认隐藏，由JS控制显示 */
    position: fixed !important;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 99999; /* 提高层级 */
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  
  /* 遮罩层样式 */
  .verify-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(255,255,255,0.1); 
    z-index: 40;
    pointer-events: none; /* 允许点击穿透，主要靠JS禁用下方元素 */
  }
</style>

<!-- 访问码模态框 -->
<div id="accessModal">
  <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full mx-4 relative z-50">
    <!-- 获取链接按钮 -->
    <a id="accessLink" href="#" target="_blank" rel="noopener noreferrer"
       class="w-full block text-center py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition mb-6 flex items-center justify-center font-bold cursor-pointer no-underline">
      <span class="mr-2">👉</span> 点击获取 <span id="linkDate"></span> 访问码
    </a>
    
    <div class="mb-4">
      <label class="block text-gray-700 text-sm mb-2 font-bold">请输入访问码：</label>
      <input id="accessCodeInput" type="text" placeholder="例如: work" maxlength="15" autocomplete="off"
             class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg"/>
    </div>
    
    <button id="verifyBtn" class="w-full py-3 bg-green-500 hover:bg-green-600 text-white rounded-lg transition font-bold text-lg shadow-md cursor-pointer">
      验证访问码
    </button>
    
    <p id="errorText" class="text-red-500 text-sm mt-4 text-center hidden font-bold"></p>
  </div>
</div>

<script>
(function() {
  // === 1. 配置区域 (请确保这里填入了真实数据) ===
  const ACCESS_MAP = {
    // 示例数据，请替换为你真实的 map
    '2024-05-20': { code: '520', link: 'https://pan.quark.cn/s/xxxx' },
    '2026-08-15': { link: 'https://pan.quark.cn/s/761ac136fa21', code: 'w51t' },
  '2026-08-27': { link: 'https://pan.quark.cn/s/d15951b81464', code: 'y94k' },
  '2026-08-28': { link: 'https://pan.quark.cn/s/757511119b42', code: '47wo' },
  '2026-08-29': { link: 'https://pan.quark.cn/s/a1602b0e53ca', code: '53jn' },
  '2026-08-30': { link: 'https://pan.quark.cn/s/0a7a8c1c201f', code: 'zv0h' },
  '2026-08-31': { link: 'https://pan.quark.cn/s/2fb6198a1d1d', code: '9wjd' },
  '2026-09-01': { link: 'https://pan.quark.cn/s/942e21ab9d6b', code: '28rs' },
  '2026-09-02': { link: 'https://pan.quark.cn/s/fe42a2997ed2', code: '4p1w' },
  '2026-09-03': { link: 'https://pan.quark.cn/s/6122150ada3f', code: 'wa5n' },
  '2026-09-04': { link: 'https://pan.quark.cn/s/370735b8ce61', code: 'hl22' },
  '2026-09-05': { link: 'https://pan.quark.cn/s/530e2cbbabcb', code: '141t' },
  '2026-09-06': { link: 'https://pan.quark.cn/s/8f3d7a0a7890', code: 'dnsu' },
  '2026-09-07': { link: 'https://pan.quark.cn/s/b05b2ec5f4d5', code: 'vmr9' },
  '2026-09-08': { link: 'https://pan.quark.cn/s/29c86f47157f', code: 'js0u' },
  '2026-09-09': { link: 'https://pan.quark.cn/s/491958038c04', code: '02ia' },
  '2026-09-10': { link: 'https://pan.quark.cn/s/94606bb4e9fc', code: 'imfl' },
  '2026-09-11': { link: 'https://pan.quark.cn/s/d662e59954e8', code: 'ko7h' },
  '2026-09-12': { link: 'https://pan.quark.cn/s/2c53566167d6', code: 'nkkb' },
  '2026-09-13': { link: 'https://pan.quark.cn/s/863ffde5c3cb', code: 'evsp' },
  '2026-09-14': { link: 'https://pan.quark.cn/s/626a6e759c47', code: 'vlyf' },
  '2026-09-15': { link: 'https://pan.quark.cn/s/15096e41359f', code: 'b73g' },
  '2026-09-16': { link: 'https://pan.quark.cn/s/5f9bce6e2333', code: 'rw0v' },
  '2026-09-17': { link: 'https://pan.quark.cn/s/bb94a9ad683e', code: 't2l4' },
  '2026-09-18': { link: 'https://pan.quark.cn/s/679d72f1580d', code: 'rj1q' },
  '2026-09-19': { link: 'https://pan.quark.cn/s/1da55438e138', code: 'pg6i' },
  '2026-09-20': { link: 'https://pan.quark.cn/s/b8f31447dc78', code: 'abjd' },
  '2026-09-21': { link: 'https://pan.quark.cn/s/e82a74b5946e', code: 'm3qn' },
  '2026-09-22': { link: 'https://pan.quark.cn/s/0edb79626ba1', code: 'tcjn' },
  '2026-09-23': { link: 'https://pan.quark.cn/s/7b0e8d7f125d', code: 'c39l' },
  '2026-09-24': { link: 'https://pan.quark.cn/s/f2ad3a54d152', code: '18wv' },
  '2026-09-25': { link: 'https://pan.quark.cn/s/a9b29cc26f07', code: 'mhnw' }
    // ... 其他日期
  };

  // === 2. 核心工具函数 ===
  function getBeijingDate() {
    const now = new Date();
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    return new Date(utc + 8 * 3600000).toLocaleDateString('sv'); // 格式 YYYY-MM-DD
  }

  function checkVerificationStatus() {
    return localStorage.getItem('lastVerifiedDate') === getBeijingDate();
  }

  function setVerificationStatus() {
    localStorage.setItem('lastVerifiedDate', getBeijingDate());
  }

  // === 3. UI 控制函数 ===
  function showOverlay() {
    // 禁用背景交互
    document.body.style.overflow = 'hidden'; // 禁止滚动
    const modal = document.getElementById('accessModal');
    if(modal) modal.style.display = 'flex';
    
    // 模糊/禁用背景元素 (根据你的实际ID调整)
    const targets = document.querySelectorAll('#typeNav button, #navSection a, .resource-card');
    targets.forEach(el => {
      el.style.pointerEvents = 'none'; 
      el.style.opacity = '0.5';
      el.style.filter = 'blur(2px)';
    });
  }

  function hideOverlay() {
    document.body.style.overflow = ''; // 恢复滚动
    const modal = document.getElementById('accessModal');
    if(modal) modal.style.display = 'none';

    const targets = document.querySelectorAll('#typeNav button, #navSection a, .resource-card');
    targets.forEach(el => {
      el.style.pointerEvents = 'auto'; 
      el.style.opacity = '1';
      el.style.filter = 'none';
    });
  }

  function updateAccessInfo() {
    const today = getBeijingDate();
    const record = ACCESS_MAP[today];
    const dateSpan = document.getElementById('linkDate');
    const linkBtn = document.getElementById('accessLink');

    if (dateSpan) dateSpan.textContent = today;

    if (record && linkBtn) {
      linkBtn.href = record.link;
      console.log('✅ 已加载今日链接:', record.link);
    } else {
      console.warn('⚠️ 未找到今日配置:', today);
      if(linkBtn) {
          linkBtn.href = '#';
          linkBtn.onclick = (e) => { e.preventDefault(); alert('管理员未配置今日链接'); };
      }
    }
  }

  // === 4. 事件绑定 ===
  function bindEvents() {
    const verifyBtn = document.getElementById('verifyBtn');
    const input = document.getElementById('accessCodeInput');
    const errorText = document.getElementById('errorText');
    const linkBtn = document.getElementById('accessLink');

    // 验证按钮点击
    if (verifyBtn) {
      verifyBtn.addEventListener('click', () => {
        const val = input.value.trim();
        const today = getBeijingDate();
        const record = ACCESS_MAP[today];

        if (!record) {
          errorText.textContent = '系统错误：今日未配置。';
          errorText.classList.remove('hidden');
          return;
        }

        if (val === record.code) {
          // 验证成功
          setVerificationStatus();
          hideOverlay();
          input.value = '';
          errorText.classList.add('hidden');
          
          // 触发主页数据加载
          if (typeof window.loadData === 'function') {
            window.loadData();
          } else {
            console.log('ℹ️ loadData 函数不存在，尝试刷新页面...');
            location.reload(); 
          }
        } else {
          // 验证失败
          errorText.textContent = '❌ 访问码错误，请重试。';
          errorText.classList.remove('hidden');
          input.classList.add('border-red-500');
        }
      });
    }

    // 回车键支持
    if (input) {
      input.addEventListener('keypress', e => {
        if (e.key === 'Enter' && verifyBtn) verifyBtn.click();
      });
    }

    // 获取链接按钮的额外保护（防止 href 为空时点击无效）
    if (linkBtn) {
        linkBtn.addEventListener('click', (e) => {
            if (!linkBtn.href || linkBtn.href.endsWith('#')) {
                e.preventDefault();
                alert('链接尚未加载，请刷新页面重试。');
            }
        });
    }
  }

  // === 5. 初始化入口 ===
  // 使用 DOMContentLoaded 确保 HTML 元素都已生成
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  function init() {
    console.log('🛡️ 验证模块初始化...');
    updateAccessInfo();
    bindEvents();

    if (checkVerificationStatus()) {
      console.log('✅ 今日已验证，直接放行');
      hideOverlay();
      // 如果已验证，尝试加载数据
      if (typeof window.loadData === 'function') window.loadData();
    } else {
      console.log('⏸️ 未验证，显示弹窗');
      showOverlay();
    }
  }

})();
</script>
