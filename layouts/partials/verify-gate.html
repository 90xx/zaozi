<style>
  /* 强制模态框样式 */
  #accessModal {
    display: none;
    position: fixed !important;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 99999;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  #accessModal .modal-box {
    background: #fff;
    border-radius: 16px;
    padding: 2rem;
    max-width: 400px;
    width: calc(100% - 2rem);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    animation: modalIn 0.3s ease;
  }

  @keyframes modalIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  #accessModal .modal-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #1f2937;
    text-align: center;
    margin-bottom: 1.5rem;
  }

  #accessModal .get-code-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 0.75rem;
    background: #3b82f6;
    color: #fff;
    border-radius: 10px;
    font-weight: 700;
    font-size: 1rem;
    text-decoration: none;
    transition: background 0.2s;
    margin-bottom: 1.5rem;
  }
  #accessModal .get-code-btn:hover { background: #2563eb; }

  #accessModal label {
    display: block;
    font-size: 0.875rem;
    color: #374151;
    margin-bottom: 0.5rem;
    font-weight: 600;
  }

  #accessModal input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 2px solid #d1d5db;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
    box-sizing: border-box;
  }
  #accessModal input:focus { border-color: #3b82f6; }
  #accessModal input.input-error { border-color: #ef4444; }

  #accessModal .verify-btn {
    width: 100%;
    padding: 0.85rem;
    background: #22c55e;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 1rem;
    transition: background 0.2s;
  }
  #accessModal .verify-btn:hover { background: #16a34a; }

  #accessModal .error-msg {
    color: #ef4444;
    font-size: 0.875rem;
    text-align: center;
    margin-top: 1rem;
    font-weight: 600;
    display: none;
  }
  #accessModal .error-msg.show { display: block; }

  /* 全屏拦截遮罩（透明，仅拦截点击） */
  #verifyBlockOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 99998;
    background: transparent;
  }
</style>

<!-- 访问码模态框 -->
<div id="accessModal">
  <div class="modal-box">
    <div class="modal-title">🔒 请输入访问码继续</div>

    <a id="accessLink" href="#" target="_blank" rel="noopener noreferrer" class="get-code-btn">
      <span style="margin-right: 0.5rem;">👉</span>
      点击获取 <span id="linkDate" style="margin-left: 0.25rem;"></span> 访问码
    </a>

    <label for="accessCodeInput">请输入访问码：</label>
    <input id="accessCodeInput" type="text" placeholder="请输入访问码" maxlength="15" autocomplete="off" />

    <button id="verifyBtn" class="verify-btn">✅ 验证访问码</button>

    <div id="errorText" class="error-msg"></div>
  </div>
</div>

  // ═══════════════════════════════════════════
  // 2. 工具函数
  // ═══════════════════════════════════════════
  function getBeijingDate() {
    const now = new Date();
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    return new Date(utc + 8 * 3600000).toLocaleDateString('sv');
  }

  function checkVerified() {
    return localStorage.getItem('zaozi_verified') === getBeijingDate();
  }

  function setVerified() {
    localStorage.setItem('zaozi_verified', getBeijingDate());
  }

  // ═══════════════════════════════════════════
  // 3. UI 控制
  // ═══════════════════════════════════════════
  function showModal() {
    document.body.style.overflow = 'hidden';
    const modal = document.getElementById('accessModal');
    if (modal) modal.style.display = 'flex';

    // 创建全屏拦截遮罩
    if (!document.getElementById('verifyBlockOverlay')) {
      const overlay = document.createElement('div');
      overlay.id = 'verifyBlockOverlay';
      document.body.appendChild(overlay);
    }
  }

  function hideModal() {
    document.body.style.overflow = '';
    const modal = document.getElementById('accessModal');
    if (modal) modal.style.display = 'none';

    const overlay = document.getElementById('verifyBlockOverlay');
    if (overlay) overlay.remove();
  }

  function updateAccessInfo() {
    const today = getBeijingDate();
    const record = ACCESS_MAP[today];
    const dateSpan = document.getElementById('linkDate');
    const linkBtn = document.getElementById('accessLink');

    if (dateSpan) dateSpan.textContent = today;

    if (record && linkBtn) {
      linkBtn.href = record.link;
    } else if (linkBtn) {
      linkBtn.href = '#';
      linkBtn.addEventListener('click', function (e) {
        e.preventDefault();
        alert('管理员未配置今日访问码，请联系管理员。');
      });
    }
  }

  // ═══════════════════════════════════════════
  // 4. 验证成功后触发主站数据加载
  // ═══════════════════════════════════════════
  function triggerDataLoad() {
    // 优先调用主脚本暴露的函数
    if (typeof window.zaoziLoadData === 'function') {
      window.zaoziLoadData();
    }
    // 其次尝试自定义事件
    else if (typeof window.dispatchEvent === 'function') {
      window.dispatchEvent(new CustomEvent('zaozi:verified'));
    }
    // 兜底：刷新页面
    else {
      location.reload();
    }
  }

  // ═══════════════════════════════════════════
  // 5. 事件绑定
  // ═══════════════════════════════════════════
  function bindEvents() {
    const verifyBtn = document.getElementById('verifyBtn');
    const input = document.getElementById('accessCodeInput');
    const errorText = document.getElementById('errorText');

    if (verifyBtn) {
      verifyBtn.addEventListener('click', function () {
        const val = input.value.trim();
        const today = getBeijingDate();
        const record = ACCESS_MAP[today];

        // 重置错误状态
        errorText.className = 'error-msg';
        input.classList.remove('input-error');

        if (!record) {
          errorText.textContent = '⚠️ 系统错误：今日未配置访问码';
          errorText.className = 'error-msg show';
          return;
        }

        if (val === record.code) {
          // ✅ 验证成功
          setVerified();
          hideModal();
          input.value = '';
          triggerDataLoad();
        } else {
          // ❌ 验证失败
          errorText.textContent = '❌ 访问码错误，请重试';
          errorText.className = 'error-msg show';
          input.classList.add('input-error');
          input.focus();
        }
      });
    }

    if (input) {
      input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verifyBtn.click();
      });
      // 输入时清除错误状态
      input.addEventListener('input', function () {
        errorText.className = 'error-msg';
        input.classList.remove('input-error');
      });
    }
  }

  // ═══════════════════════════════════════════
  // 6. 初始化
  // ═══════════════════════════════════════════
  function init() {
    updateAccessInfo();
    bindEvents();

    if (checkVerified()) {
      hideModal();
      triggerDataLoad();
    } else {
      showModal();
    }
  }

  // 确保 DOM 就绪后初始化
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
