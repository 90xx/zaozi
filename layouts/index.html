<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Title }}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- 💬 公告/留言入口（保持原样不动） -->
  <a href="https://www.kdocs.cn/l/crOyXHBVm96c" target="_blank" 
     style="position:fixed; top:1.25rem; right:2rem; z-index:999;
            padding:0.6rem 1.4rem; border-radius:999px;
            background:#1a1a2e; 
            border:1px solid rgba(255,255,255,0.15); color:#ffffff;
            font-size:0.85rem; text-decoration:none; transition:all 0.3s;
            box-shadow:0 2px 8px rgba(0,0,0,0.3);"
     onmouseover="this.style.background='#2a2a4a'"
     onmouseout="this.style.background='#1a1a2e'">
    💬 新人必看
  </a>

  <header>
    <h1>{{ .Site.Title }}</h1>
    <p>{{ .Site.Params.description }}</p>
  </header>

  <main>
    {{ partial "category-filter.html" . }}

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索资源名称...">
    </div>

    <div id="resourceList" class="resource-grid"></div>

    <div id="noResults" class="no-results" style="display:none;">
      😕 没有找到匹配的资源
    </div>
 
    <!-- Hugo 数据注入 -->
    <script>
      {{ $allResources := slice }}
      {{ with hugo.Data.resources }}
        {{ range $key, $val := . }}
          {{ if reflect.IsSlice $val }}
            {{ range $item := $val }}
              {{ $allResources = $allResources | append $item }}
            {{ end }}
          {{ else }}
            {{ $allResources = $allResources | append $val }}
          {{ end }}
        {{ end }}
      {{ end }}
      const RESOURCES = {{ $allResources | jsonify | safeJS }};
      console.log('[Hugo] 注入资源总数:', {{ len $allResources }});
    </script>

    <script src="/js/filter.js"></script>
    {{ partial "verify-gate.html" . }}
    {{ partial "time-group.html" . }}

    <!-- 💬 外部留言入口（替代 Twikoo） -->
    <div style="margin-top:3rem; padding:2rem 1rem; text-align:center; border-top:1px solid rgba(255,255,255,0.08);">
      <p style="color:rgba(255,255,255,0.5); font-size:0.9rem; margin-bottom:1rem;">
      </p>
      <a href="https://docs.qq.com/form/page/DZk9LQnJLbEtiQm9o" target="_blank" rel="noopener noreferrer"
         style="display:inline-flex; align-items:center; gap:0.5rem;
                padding:0.75rem 2rem; border-radius:999px;
                background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color:#fff; font-size:1rem; font-weight:500;
                text-decoration:none; transition:all 0.3s ease;
                box-shadow:0 4px 15px rgba(118,75,162,0.4);">
        <span>✉️</span>
        <span>留言板</span>
      </a>
    </div>

  </main>
</body>
</html>
